# ============================================================
# CodeNexus Backend Configuration
# ============================================================

spring.application.name=codenexus-backend

# ============================================================
# SERVER
# ============================================================

server.port=8080

# ============================================================
# MYSQL DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codenexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JSON
# ============================================================

spring.jackson.serialization.fail-on-empty-beans=false

# ============================================================
# FILE / REQUEST LIMITS
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
logging.level.com.codenexus.backend=INFO
logging.level.org.springframework.security=INFO

# ============================================================
# ERROR RESPONSES
# ============================================================

server.error.include-message=always
server.error.include-binding-errors=always